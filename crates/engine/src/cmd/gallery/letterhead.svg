    <text x="56" y="206" font-family="Inter" font-size="9.5" font-weight="500" fill="#1F2B33">
      <tspan x="56" dy="0">Recipient name</tspan>
      <tspan x="56" dy="14" font-weight="400" fill="#4A5A63">Company or address</tspan>
