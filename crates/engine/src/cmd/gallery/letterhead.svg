    <text x="56" y="330" font-family="Inter" font-size="10" fill="#3B4B57">
      <tspan x="56" dy="0">Dear name,</tspan>
      <tspan x="56" dy="26">Write your message here. This letterhead keeps the page calm: a quiet header,</tspan>
      <tspan x="56" dy="16">generous margins and a footer with your details. Replace this text, or delete it</tspan>
      <tspan x="56" dy="16">and paste your own.</tspan>
      <tspan x="56" dy="26">Keep paragraphs short and leave a little air between them, so the letter reads</tspan>
      <tspan x="56" dy="16">easily at a glance.</tspan>
      <tspan x="56" dy="26">Kind regards,</tspan>
    </text>
