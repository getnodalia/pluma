[package]
name = "pluma-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma SVG import and export"

[lints]
workspace = true

[dependencies]
nodalia-svg = { workspace = true }
nodalia-mime = { workspace = true }
# Which paths stored in documents may be opened.
nodalia-docpath = { workspace = true }
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-effects = { workspace = true }
pluma-brush = { workspace = true }
pluma-text = { workspace = true }
pluma-pathops = { workspace = true }
kurbo = { workspace = true }
# Image elements still go through usvg's image href resolution (src/import/files.rs, src/import/budget.rs).
usvg = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Live effect params read from filters.
serde_json = { workspace = true }
# SVGZ (gzip, pure-Rust backend: builds for wasm).
flate2 = { workspace = true }
image = { workspace = true }
nodalia-image-codecs = { workspace = true }
# Image data URLs decoded as usvg decodes them, within a byte limit (MIT OR Apache-2.0; already used by usvg).
data-url = "0.3.2"
# Colour / transform / length parsing for the <text> fallback (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"
simplecss = "0.2.2"
# Bidi classes for the first strong character of `unicode-bidi: plaintext` text (MIT OR Apache-2.0; already used by pluma-text).
unicode-bidi = "0.3.18"

[dev-dependencies]
# Reading embedded font subsets back.
skrifa = { workspace = true }
# A variable font built in code (no font file is committed).
pluma-text = { workspace = true, features = ["test-fonts"] }
nodalia-svg = { workspace = true, features = ["tree-render", "tree-text"] }
pluma-testkit = { workspace = true }
proptest = { workspace = true }
# How many times the symbol list is read to find symbols by name.
pluma-doc = { workspace = true, features = ["symbol-read-count"] }
