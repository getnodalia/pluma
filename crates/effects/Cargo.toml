[package]
name = "pluma-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma live effects evaluated to geometry"

[lints]
workspace = true

[dependencies]
pluma-geom = { workspace = true }
pluma-three-d = { workspace = true }
pluma-doc = { workspace = true }
pluma-pathops = { workspace = true }
pluma-text = { workspace = true }
pluma-plugins = { workspace = true }
pluma-trace = { workspace = true }
image = { workspace = true }
craft-image-codecs = { workspace = true }
kurbo = { workspace = true }
# Effect › SVG Filters draws its filters with craft-svg's resvg (`tree-render`).
craft-svg = { workspace = true, features = ["tree-render"] }
# The number lists of filter attributes, read as usvg reads them (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"
serde_json = { workspace = true }

[dev-dependencies]
pluma-color = { workspace = true }
# A face built in code from the bundled Source Sans 3 (no font file is committed).
pluma-text = { workspace = true, features = ["test-fonts"] }
# Test live-effect plug-ins written in WebAssembly text.
wat = { workspace = true }
