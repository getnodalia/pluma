[package]
name = "pluma-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma CAD interchange: DXF export through nodalia-dxf and an HP-GL/2 plot file reader and writer"

[lints]
workspace = true

[dependencies]
nodalia-dxf = { workspace = true }
nodalia-plotter = { workspace = true }
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-effects = { workspace = true }
pluma-brush = { workspace = true }
pluma-pathops = { workspace = true }
pluma-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
nodalia-image-codecs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine)
# and in fonts built in code (`pluma_text::test_fonts`).
pluma-text = { workspace = true, features = ["bundled-fonts", "test-fonts"] }
