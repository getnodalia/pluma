name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@a5325485b557dca4040002a0120a06d72b10ccb5 # foundation main
    with:
      # Same nodalia-fonts commit as the release-*.yml workflows.
      fonts-repository: getnodalia/foundation
      fonts-ref: d4f57e6b31d7c7526b539f7aaaa07312c9908bb8
      # Only master saves the build cache, and a cold run on a standard 4 vCPU runner takes about
      # 100 minutes (clippy 6, test build 47, tests 20, no-bundled-fonts builds 15 or more). Pull
      # requests read master's cache, but until master has saved one they run cold too, so they
      # get room to finish as well; master gets more, to finish and save the cache.
      timeout-minutes: ${{ github.event_name == 'pull_request' && 150 || 180 }}
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
